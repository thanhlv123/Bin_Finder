name: Bootstrap Bin Finder F002 source

on:
  push:
    branches:
      - bin-finder-f002-provider-discovery
    paths:
      - "bootstrap/f002_parts/**"

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and unpack F002 source
        shell: bash
        run: |
          cat bootstrap/f002_parts/part_*.b64 > /tmp/bin_finder_f002.b64
          base64 --decode /tmp/bin_finder_f002.b64 > /tmp/bin_finder_f002.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("/tmp/bin_finder_f002.zip")
          root = Path(".").resolve()
          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  target = (root / member.filename).resolve()
                  if root not in target.parents and target != root:
                      raise RuntimeError(f"Unsafe archive member: {member.filename}")
              zf.extractall(root)

          shutil.rmtree("bootstrap", ignore_errors=True)
          PY

      - name: Commit imported F002 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "F002: import provider discovery source [skip ci]"
          git push
