name: Bootstrap Bin Finder baseline

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/Bin_Finder_F001_5.zip"

permissions:
  contents: write

jobs:
  unpack-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack tested F001.5 baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("bootstrap/Bin_Finder_F001_5.zip")
          root = Path(".").resolve()
          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  target = (root / member.filename).resolve()
                  if root not in target.parents and target != root:
                      raise RuntimeError(f"Unsafe archive member: {member.filename}")
              zf.extractall(root)
          archive.unlink()
          bootstrap = Path("bootstrap")
          if bootstrap.exists() and not any(bootstrap.iterdir()):
              bootstrap.rmdir()
          PY

      - name: Commit imported baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "F001.5: import tested Windows baseline [skip ci]"
          git push
